[project]
name = "fluxmax"
version = "1.0.2"
description = "GNOME/Wayland-native f.lux-equivalent blue-light filter"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fluxmax-apply = "fluxmax.backend.cli:main"
fluxmax-daemon = "fluxmax.daemon.main:main"
fluxmax-gui = "fluxmax.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluxmax*"]
