[project]
name = "duskcurve"
version = "1.0.4"
description = "GNOME/Wayland-native blue-light filter"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
duskcurve-apply = "duskcurve.backend.cli:main"
duskcurve-daemon = "duskcurve.daemon.main:main"
duskcurve-gui = "duskcurve.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["duskcurve*"]
