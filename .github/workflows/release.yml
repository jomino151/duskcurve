name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build extension archive
        run: cd extension/focused-window@duskcurve && zip -r ../../focused-window@duskcurve.shell-extension.zip .
      - name: Build sdist and wheel
        run: python3 -m venv /tmp/b && /tmp/b/bin/pip install build && /tmp/b/bin/python -m build
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [") == 1 { on = (index($0, "## [" v "]") == 1); next }
            on
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version" >&2; exit 1; }
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md focused-window@duskcurve.shell-extension.zip dist/*
        env:
          GH_TOKEN: ${{ github.token }}
