name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-venv gir1.2-glib-2.0 dbus-daemon shellcheck
      - name: Install Python dependencies
        run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install -e '.[dev]'
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Pytest
        run: dbus-run-session -- .venv/bin/pytest -q --cov=duskcurve --cov-report=term
      - name: Shellcheck
        run: shellcheck install.sh uninstall.sh scripts/lib.sh
      - name: ESLint
        run: npx --yes eslint@9 extension/
