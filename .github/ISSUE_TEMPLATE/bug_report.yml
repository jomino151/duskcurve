name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: input
    id: gnome-version
    attributes:
      label: GNOME version
      description: Output of `gnome-shell --version`.
    validations:
      required: true
  - type: input
    id: duskcurve-version
    attributes:
      label: Duskcurve version
      description: Version of the installed release, or the commit if built from source.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: Output of `journalctl --user -u duskcurve-daemon`.
      render: shell
